<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>南屯 自走車控制台（基本版）</title>
<style>
  :root{
    --bg:#eef1f6; --card:#fff; --ink:#1f2833; --muted:#71798a;
    --brand:#2b6cb0; --brand-d:#22528a; --ok:#2f9e57; --warn:#c0392b;
    --line:#e1e6ee; --grid:#dfe6f0;
    --shadow:0 2px 10px rgba(30,50,80,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--ink);user-select:none;display:flex;flex-direction:column;height:100vh}

  .top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card);
    border-bottom:1px solid var(--line);flex-wrap:wrap;box-shadow:var(--shadow);z-index:5}
  .dot{width:11px;height:11px;border-radius:50%;background:#c3ccd8;flex:none}
  .dot.on{background:var(--ok)}
  .stat{font-size:13px;font-weight:600;min-width:70px}
  button{font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;border:none;
    border-radius:10px;padding:9px 13px;color:#fff;background:var(--brand);touch-action:manipulation}
  button:active{transform:scale(.96)}
  button.ghost{background:#eef2f7;color:var(--brand)}
  button.warn{background:#f3e6e6;color:var(--warn)}
  .seg{display:flex;background:#e7ecf3;border-radius:10px;padding:3px;gap:3px}
  .seg button{background:transparent;color:var(--muted);padding:7px 12px;border-radius:8px}
  .seg button.active{background:var(--brand);color:#fff}
  .spacer{flex:1}
  select{font-family:inherit;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff}

  .palette{display:flex;gap:6px;flex-wrap:wrap;padding:6px 10px;background:#f7f9fc;border-bottom:1px solid var(--line)}
  .palette button{background:#fff;color:var(--ink);border:1px solid var(--line);font-size:13px;padding:7px 10px}
  .palette .cat{font-size:12px;color:var(--muted);align-self:center;margin:0 2px 0 6px}
  .palette button.star{background:#fff6e6;border-color:#f0d9a8;color:#8a6d1f}

  #canvas{position:relative;flex:1;overflow:auto}
  #canvas.edit{background-image:linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
  .w{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;font-size:15px}
  .w .cap{font-size:.8em;color:var(--muted);text-align:center;margin-bottom:2px}
  .edit .w{cursor:move}
  .w .drag{position:absolute;inset:0;border-radius:14px;z-index:3;display:none}
  .edit .w .drag{display:block}
  .edit .w .body{pointer-events:none}
  .w .del{position:absolute;top:-9px;right:-9px;width:24px;height:24px;border-radius:50%;
    background:var(--warn);color:#fff;font-size:15px;line-height:24px;text-align:center;z-index:4;display:none}
  .edit .w .del{display:block}
  .w .badge-sz{position:absolute;left:-8px;top:-9px;font-size:11px;background:#eef2f7;color:var(--muted);
    border:1px solid var(--line);border-radius:20px;padding:1px 7px;z-index:4;display:none}
  .edit .w .badge-sz{display:block}

  /* 按鈕型 */
  .bigbtn{flex:1;border-radius:12px;font-size:1.33em;background:var(--brand);color:#fff;touch-action:none}
  .axis,.joy{touch-action:none}
  .bigbtn.on{background:var(--ok);color:#fff}
  .skey{font-size:.8em;color:var(--muted);text-align:center;margin-top:3px}
  /* ±軸型（方向盤/滑桿）*/
  .axis{flex:1;position:relative;border-radius:12px;background:#eef2f7;overflow:hidden;min-height:44px}
  .axis .mid{position:absolute;background:#d3dbe6}
  .axis .mid.h{left:50%;top:8%;width:2px;height:84%;transform:translateX(-50%)}
  .axis .mid.v{top:50%;left:8%;height:2px;width:84%;transform:translateY(-50%)}
  .axis .knob{position:absolute;width:2.6em;height:2.6em;border-radius:50%;background:var(--brand);
    left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .axis .val{position:absolute;right:8px;top:6px;font-size:.85em;font-weight:800;color:var(--brand-d)}
  /* 全向搖桿 */
  .joy{flex:1;position:relative;border-radius:14px;background:#eef2f7;overflow:hidden;min-height:60px}
  .joy .knob{position:absolute;width:2.93em;height:2.93em;border-radius:50%;background:var(--brand);
    left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.2)}
  /* 儀表板 */
  .num{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .num .v{font-size:2em;font-weight:800}
  .ring{position:relative;width:6.13em;height:6.13em;border-radius:50%;margin:auto;
    background:conic-gradient(var(--brand) calc(var(--p,0)*1%),#e6ebf2 0);display:grid;place-items:center}
  .ring::before{content:'';position:absolute;width:4.4em;height:4.4em;border-radius:50%;background:var(--card)}
  .ring b{position:relative;font-size:1.2em;font-weight:800}
  .led{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .led .lamp{width:3.07em;height:3.07em;border-radius:50%;background:#cfd6e0;box-shadow:inset 0 2px 6px rgba(0,0,0,.15)}
  .led .lamp.on{background:var(--ok);box-shadow:0 0 14px rgba(47,158,87,.7)}
  canvas{width:100%;flex:1;display:block}

  .hint{margin:10px;padding:12px 14px;background:#fff6e6;border:1px solid #f0d9a8;color:#8a6d1f;
    border-radius:12px;font-size:14px;line-height:1.6;display:none}
  .hint.show{display:block}
  .modal{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  .modal.show{display:flex}
  .sheet{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:340px}
  .sheet h3{margin:0 0 12px;font-size:17px}
  .fld{margin-bottom:10px}
  .fld label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
  .fld input,.fld select{width:100%;font-size:15px;padding:9px;border:1px solid var(--line);border-radius:10px}
  .sheet .acts{display:flex;gap:8px;margin-top:14px}
  .sheet .acts button{flex:1}
  .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#9aa4b2;font-size:15px;text-align:center;pointer-events:none;padding:20px}
</style>
</head>
<body>

<div class="top">
  <div class="dot" id="dot"></div>
  <div class="stat" id="stat">未連線</div>
  <button id="conn">連線</button>
  <div class="stat" id="rx" style="min-width:0;font-weight:400;color:var(--muted);font-size:12px"></div>
  <div class="seg">
    <button id="mEdit" class="active">編輯</button>
    <button id="mPlay">遊玩</button>
  </div>
  <div class="spacer"></div>
  <button class="ghost" id="exp">匯出</button>
  <button class="ghost" id="imp">匯入</button>
  <button class="warn" id="clear">清空</button>
</div>

<div class="palette" id="palette">
  <button class="star" data-basic="1">★ 基本版面</button>
  <span class="cat">遙控（送給車）</span>
  <button data-add="button">＋按鈕</button>
  <button data-add="axis">＋方向盤／滑桿</button>
  <button data-add="joystick">＋全向搖桿</button>
  <span class="cat">儀表板（顯示車回傳）</span>
  <button data-add="number">＋數字卡</button>
  <button data-add="chart">＋折線圖</button>
  <button data-add="gauge">＋儀表盤</button>
  <button data-add="led">＋燈號</button>
</div>

<div class="hint show" id="hint">
  👉 這是<b>基本版</b>：只有三種輸入 —— <b>按鈕</b>（送 代號:1／代號:0）、<b>方向盤／滑桿</b>（送 代號:值）、<b>全向搖桿</b>（送 代號:x,y）。<br>
  點 <b>★ 基本版面</b> 一鍵擺好一台能開的車；或自己從選盤加元件、拖曳、點元件設定、右上 ✕ 刪除。<br>
  排好切到 <b>遊玩</b> 按「連線」。iPad 請用 <b>Bluefy</b> 瀏覽器開啟。
</div>

<div id="canvas" class="edit">
  <div class="empty" id="empty">畫布是空的 —— 按上方「★ 基本版面」或從選盤加入元件</div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="mTitle">設定</h3>
    <div id="mFields"></div>
    <div class="acts">
      <button class="ghost" id="mCancel">取消</button>
      <button id="mOk">確定</button>
    </div>
  </div>
</div>

<div class="modal" id="expModal">
  <div class="sheet">
    <h3>版面代碼</h3>
    <p style="font-size:13px;color:var(--muted);margin:0 0 8px">按「複製」把代碼交到表單／傳給別台 iPad；別台用「匯入」貼回去就還原。</p>
    <textarea id="expText" readonly style="width:100%;height:120px;font-size:12px;padding:9px;border:1px solid var(--line);border-radius:10px;font-family:ui-monospace,Menlo,Consolas,monospace"></textarea>
    <div class="acts">
      <button class="ghost" id="expClose">關閉</button>
      <button id="expCopy">複製</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const UART="6e400001-b5a3-f393-e0a9-e50e24dcca9e";

/* ===================== 大小 ===================== */
const SIZES={ "小":0.75, "中":1, "大":1.4 };

/* ===================== 三種輸入 + 儀表板 ===================== */
const TYPE={
  button:{name:"按鈕",kind:"ctrl",w:120,h:96,cfg:{label:"按鈕",key:"A",latch:false}},
  axis:{name:"方向盤／滑桿",kind:"ctrl",w:210,h:120,cfg:{label:"方向盤",key:"STEER",dir:"h",min:-100,max:100,center:true}},
  joystick:{name:"全向搖桿",kind:"ctrl",w:180,h:190,cfg:{label:"搖桿",key:"J"}},
  number:{name:"數字卡",kind:"dash",w:120,h:104,cfg:{label:"數值",key:""}},
  chart:{name:"折線圖",kind:"dash",w:300,h:170,cfg:{label:"趨勢",key:""}},
  gauge:{name:"儀表盤",kind:"dash",w:150,h:160,cfg:{label:"量表",key:"",min:0,max:100}},
  led:{name:"燈號",kind:"dash",w:130,h:104,cfg:{label:"狀態",key:"",cmp:">",thr:50}},
};
const SCHEMA={
  button:[["label","按鈕文字",""],["key","代號（送出 代號:1／代號:0）",""],["latch","保持（按一下切換，不用按住）","b"]],
  axis:[["label","標籤",""],["key","代號（送出 代號:值）",""],["dir","方向","d"],["min","最小值","n"],["max","最大值","n"],["center","放開回中","b"]],
  joystick:[["label","標籤",""],["key","前綴（送出 前綴:x,y）",""]],
  number:[["label","標籤",""],["key","顯示哪個感測值","k"]],
  chart:[["label","標籤",""],["key","繪製哪個感測值","k"]],
  gauge:[["label","標籤",""],["key","感測值","k"],["min","最小","n"],["max","最大","n"]],
  led:[["label","標籤",""],["key","感測值","k"],["cmp","條件","c"],["thr","門檻","n"]],
};

/* ===================== 狀態 ===================== */
let widgets=[], editMode=true, uid=1;
let device=null,rxChar=null,txChar=null,connected=false,rxBuf="";
const latest={}, seenKeys=new Set();

/* ===================== 版面存讀 ===================== */
const LS_CUR="mbcarbasic_current";
function strip(list){ return list.map(w=>({id:w.id,type:w.type,x:w.x,y:w.y,size:w.size,cfg:w.cfg})); }
function persist(){ try{ localStorage.setItem(LS_CUR,JSON.stringify(strip(widgets))); }catch(e){} }
function loadCurrent(){ try{ const d=JSON.parse(localStorage.getItem(LS_CUR)); if(Array.isArray(d)){widgets=d; uid=Math.max(1,...d.map(w=>w.id))+1;} }catch(e){} }
$("clear").onclick=()=>{ if(confirm("清空畫布？")){ widgets=[]; render(); persist(); } };

/* ===================== 匯出／匯入版面（跨裝置收集用）===================== */
function encodeLayout(){ return btoa(unescape(encodeURIComponent(JSON.stringify(strip(widgets))))); }
function decodeLayout(code){ return JSON.parse(decodeURIComponent(escape(atob(code.trim())))); }
$("exp").onclick=()=>{
  if(!widgets.length){ alert("畫布是空的，沒有版面可以匯出。"); return; }
  $("expText").value=encodeLayout(); $("expModal").classList.add("show");
  setTimeout(()=>{ $("expText").focus(); $("expText").select(); },50);
};
$("expClose").onclick=()=>$("expModal").classList.remove("show");
$("expCopy").onclick=async()=>{
  const t=$("expText"); t.focus(); t.select();
  try{ await navigator.clipboard.writeText(t.value); $("expCopy").textContent="已複製"; setTimeout(()=>$("expCopy").textContent="複製",1200); }
  catch(e){ try{ document.execCommand("copy"); $("expCopy").textContent="已複製"; setTimeout(()=>$("expCopy").textContent="複製",1200);}catch(_){ alert("請長按上方文字框，全選後複製。"); } }
};
$("imp").onclick=()=>{
  const code=prompt("貼上版面代碼："); if(!code) return;
  let d; try{ d=decodeLayout(code); }catch(e){ alert("代碼看起來不正確，請重新複製整段。"); return; }
  if(!Array.isArray(d)||!d.length){ alert("代碼內沒有版面資料。"); return; }
  if(widgets.length && !confirm("匯入會取代目前畫布，確定？")) return;
  widgets=d; uid=Math.max(1,...d.map(w=>w.id))+1; render(); persist();
};

/* ===================== 基本版面（一鍵擺好能開的車）===================== */
function loadBasic(){
  if(widgets.length && !confirm("載入基本版面會取代目前畫布，確定？")) return;
  widgets=[
    {id:1,type:"button",x:150,y:20,size:"大",cfg:{label:"前進",key:"FWD",latch:false}},
    {id:2,type:"button",x:20,y:190,size:"大",cfg:{label:"左",key:"LEFT",latch:false}},
    {id:3,type:"button",x:280,y:190,size:"大",cfg:{label:"右",key:"RIGHT",latch:false}},
    {id:4,type:"number",x:150,y:190,size:"中",cfg:{label:"循跡",key:""}},
  ];
  uid=5; render(); persist();
}
$("palette").querySelector("[data-basic]").onclick=loadBasic;

/* ===================== 模式切換 ===================== */
$("mEdit").onclick=()=>setMode(true);
$("mPlay").onclick=()=>setMode(false);
function setMode(edit){
  editMode=edit;
  $("mEdit").classList.toggle("active",edit); $("mPlay").classList.toggle("active",!edit);
  $("canvas").classList.toggle("edit",edit);
  $("palette").style.display=edit?"flex":"none";
  render();
}

/* ===================== 新增元件 ===================== */
function addWidget(type,cfg){
  const n=widgets.length;
  widgets.push({id:uid++,type,x:20+(n%5)*26,y:20+(n%5)*26,size:"中",cfg:JSON.parse(JSON.stringify(cfg))});
  render(); persist();
}
document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addWidget(b.dataset.add,TYPE[b.dataset.add].cfg));

/* ===================== 繪製畫布 ===================== */
function render(){
  const cv=$("canvas");
  cv.querySelectorAll(".w").forEach(e=>e.remove());
  $("empty").style.display=widgets.length?"none":"flex";
  widgets.forEach(w=>{
    const T=TYPE[w.type]; if(!T) return;
    const s=SIZES[w.size]||1;
    const el=document.createElement("div"); el.className="w"; el.dataset.id=w.id;
    el.style.left=w.x+"px"; el.style.top=w.y+"px";
    el.style.width=Math.round(T.w*s)+"px"; el.style.height=Math.round(T.h*s)+"px";
    el.style.fontSize=(15*s)+"px";
    const body=document.createElement("div"); body.className="body"; body.style.cssText="flex:1;display:flex;flex-direction:column";
    buildBody(w,body);
    el.appendChild(body);
    const drag=document.createElement("div"); drag.className="drag"; el.appendChild(drag);
    const del=document.createElement("div"); del.className="del"; del.textContent="×"; el.appendChild(del);
    const sz=document.createElement("div"); sz.className="badge-sz"; sz.textContent=w.size||"中"; el.appendChild(sz);
    del.addEventListener("pointerdown",ev=>{ev.stopPropagation(); widgets=widgets.filter(x=>x.id!==w.id); render(); persist();});
    enableDrag(drag,el,w);
    cv.appendChild(el);
    w._el=el;
  });
}

/* 建立各元件內容 */
function buildBody(w,body){
  const c=w.cfg;
  if(w.type==="button"){
    body.innerHTML=`<button class="bigbtn">${esc(c.label)}</button>
      <div class="skey">${esc(c.key||"未設定")} : 1／0</div>`;
    const b=body.querySelector("button");
    if(c.latch){
      let on=false;
      b.addEventListener("pointerdown",e=>{e.preventDefault(); on=!on; b.classList.toggle("on",on); send(c.key+":"+(on?1:0));});
    }else{
      b.addEventListener("pointerdown",e=>{e.preventDefault(); b.setPointerCapture(e.pointerId); b.classList.add("on"); send(c.key+":1");});
      b.addEventListener("pointerup",e=>{ b.classList.remove("on"); send(c.key+":0");});
      b.addEventListener("pointercancel",e=>{ b.classList.remove("on"); send(c.key+":0");});
    }
  }
  else if(w.type==="axis"){
    const horiz=c.dir!=="v";
    body.innerHTML=`<div class="cap">${esc(c.label)}</div>
      <div class="axis"><div class="mid ${horiz?"h":"v"}"></div><div class="val">0</div><div class="knob"></div></div>
      <div class="skey">${esc(c.key||"未設定")} : ${c.min}~${c.max}${c.center?"（放開回中）":""}</div>`;
    setupAxis(body.querySelector(".axis"),c,horiz);
  }
  else if(w.type==="joystick"){
    body.innerHTML=`<div class="cap">${esc(c.label)}</div><div class="joy"><div class="knob"></div></div>
      <div class="skey">${esc(c.key||"未設定")} : x,y</div>`;
    setupJoystick(body.querySelector(".joy"),c);
  }
  else if(w.type==="number"){
    body.innerHTML=`<div class="cap">${esc(c.label)}</div><div class="num"><div class="v">–</div>
      <div style="font-size:.8em;color:var(--muted)">${esc(c.key||"未設定")}</div></div>`;
  }
  else if(w.type==="chart"){
    body.innerHTML=`<div class="cap">${esc(c.label)}（${esc(c.key||"未設定")}）</div><canvas></canvas>`;
    w._data=w._data||[];
  }
  else if(w.type==="gauge"){
    body.innerHTML=`<div class="cap">${esc(c.label)}</div>
      <div class="ring" style="--p:0"><b>–</b></div>
      <div style="font-size:.8em;color:var(--muted);text-align:center">${esc(c.key||"未設定")}</div>`;
  }
  else if(w.type==="led"){
    body.innerHTML=`<div class="cap">${esc(c.label)}</div><div class="led">
      <div class="lamp"></div><div style="font-size:.8em;color:var(--muted)">${esc(c.key||"未設定")} ${esc(c.cmp)} ${c.thr}</div></div>`;
  }
}

/* ±軸：單向、可回中，送 代號:值 */
function setupAxis(box,c,horiz){
  const knob=box.querySelector(".knob"), vlab=box.querySelector(".val");
  const mn=Number(c.min), mx=Number(c.max);
  const centerVal=(mn<0&&mx>0)?0:mn;
  let active=false,last=0;
  function place(val){
    const ratio=(val-mn)/(mx-mn);
    if(horiz){ knob.style.left=(ratio*100)+"%"; knob.style.top="50%"; }
    else{ knob.style.top=((1-ratio)*100)+"%"; knob.style.left="50%"; }
    vlab.textContent=val;
  }
  function valAt(ev){
    const r=box.getBoundingClientRect();
    let ratio=horiz?(ev.clientX-r.left)/r.width:1-(ev.clientY-r.top)/r.height;
    ratio=Math.max(0,Math.min(1,ratio));
    return Math.round(mn+ratio*(mx-mn));
  }
  function move(ev){
    if(!active) return;
    const v=valAt(ev); place(v);
    const now=Date.now(); if(now-last>70){ last=now; send(c.key+":"+v); }
  }
  box.addEventListener("pointerdown",e=>{e.preventDefault(); active=true; box.setPointerCapture(e.pointerId); const v=valAt(e); place(v); send(c.key+":"+v);});
  box.addEventListener("pointermove",move);
  box.addEventListener("pointerup",e=>{ active=false;
    if(c.center){ place(centerVal); send(c.key+":"+centerVal); }
    else{ const v=valAt(e); place(v); send(c.key+":"+v); }
  });
  place(c.center?centerVal:mn);
}

/* 全向搖桿：送 前綴:x,y（各 -100~100，放開回 0,0）*/
function setupJoystick(el,c){
  const knob=el.querySelector(".knob"); let active=false,last=0;
  const R=()=>Math.min(el.clientWidth,el.clientHeight)/2-(knob.offsetWidth||44)/2;
  function move(ev){
    if(!active) return;
    const r=el.getBoundingClientRect();
    let dx=ev.clientX-(r.left+r.width/2), dy=ev.clientY-(r.top+r.height/2);
    const max=R(), d=Math.hypot(dx,dy); if(d>max){ dx=dx/d*max; dy=dy/d*max; }
    knob.style.left=(r.width/2+dx)+"px"; knob.style.top=(r.height/2+dy)+"px";
    const x=Math.round(dx/max*100), y=Math.round(-dy/max*100);
    const now=Date.now(); if(now-last>80){ last=now; send(`${c.key}:${x},${y}`); }
  }
  el.addEventListener("pointerdown",e=>{e.preventDefault(); active=true; el.setPointerCapture(e.pointerId); move(e);});
  el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",e=>{ active=false; knob.style.left="50%"; knob.style.top="50%"; send(`${c.key}:0,0`);});
}

/* ===================== 拖曳移動 ===================== */
function enableDrag(handle,el,w){
  let sx,sy,ox,oy,moved;
  handle.addEventListener("pointerdown",e=>{
    if(!editMode) return; e.preventDefault(); handle.setPointerCapture(e.pointerId);
    sx=e.clientX; sy=e.clientY; ox=w.x; oy=w.y; moved=false;
  });
  handle.addEventListener("pointermove",e=>{
    if(e.buttons!==1) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
    w.x=Math.max(0,Math.round((ox+dx)/8)*8); w.y=Math.max(0,Math.round((oy+dy)/8)*8);
    el.style.left=w.x+"px"; el.style.top=w.y+"px";
  });
  handle.addEventListener("pointerup",e=>{ if(!moved){ openConfig(w); } else persist(); });
}

/* ===================== 設定視窗 ===================== */
let editing=null;
function openConfig(w){
  editing=w; $("mTitle").textContent=TYPE[w.type].name+" 設定";
  const box=$("mFields"); box.innerHTML="";
  const sf=document.createElement("div"); sf.className="fld";
  const ssel=document.createElement("select"); ssel.dataset.size="1";
  ["小","中","大"].forEach(o=>{ ssel.innerHTML+=`<option>${o}</option>`; });
  ssel.value=w.size||"中";
  sf.innerHTML='<label>大小</label>'; sf.appendChild(ssel); box.appendChild(sf);
  SCHEMA[w.type].forEach(([k,label,t])=>{
    const f=document.createElement("div"); f.className="fld";
    let ctrl;
    if(t==="k"){
      ctrl=document.createElement("select");
      const common=["LINE","LIGHT","SOUND","DIST","TEMP"];
      const keys=[]; common.forEach(x=>keys.push(x)); [...seenKeys].forEach(x=>{ if(keys.indexOf(x)<0) keys.push(x); });
      if(w.cfg[k]&&keys.indexOf(w.cfg[k])<0) keys.push(w.cfg[k]);
      ctrl.innerHTML='<option value="">（未設定）</option>'+keys.map(k2=>`<option>${esc(k2)}</option>`).join("");
      ctrl.value=w.cfg[k]||"";
    }else if(t==="c"){
      ctrl=document.createElement("select");
      ["> ",">=","< ","<=","=="].forEach(o=>{const op=o.trim();ctrl.innerHTML+=`<option value="${op}">${op}</option>`;});
      ctrl.value=w.cfg[k];
    }else if(t==="b"){
      ctrl=document.createElement("select");
      ctrl.innerHTML='<option value="true">是</option><option value="false">否</option>';
      ctrl.value=w.cfg[k]?"true":"false";
    }else if(t==="d"){
      ctrl=document.createElement("select");
      ctrl.innerHTML='<option value="h">橫（左右）</option><option value="v">直（上下）</option>';
      ctrl.value=w.cfg[k]||"h";
    }else{
      ctrl=document.createElement("input"); ctrl.type=(t==="n")?"number":"text"; ctrl.value=w.cfg[k];
    }
    ctrl.dataset.k=k; ctrl.dataset.t=t;
    f.innerHTML=`<label>${label}</label>`; f.appendChild(ctrl); box.appendChild(f);
  });
  $("modal").classList.add("show");
}
$("mCancel").onclick=()=>$("modal").classList.remove("show");
$("mOk").onclick=()=>{
  const ss=$("mFields").querySelector("[data-size]"); if(ss) editing.size=ss.value;
  $("mFields").querySelectorAll("[data-k]").forEach(ctrl=>{
    let v=ctrl.value, t=ctrl.dataset.t;
    if(t==="n") v=Number(v);
    else if(t==="b") v=(v==="true");
    editing.cfg[ctrl.dataset.k]=v;
  });
  $("modal").classList.remove("show"); render(); persist();
};

/* ===================== 儀表板更新 ===================== */
function updateDash(){
  widgets.forEach(w=>{
    if(TYPE[w.type].kind!=="dash"||!w._el) return;
    const key=w.cfg.key, val=latest[key];
    if(w.type==="number"){
      w._el.querySelector(".v").textContent=(val===undefined?"–":val);
    }else if(w.type==="gauge"){
      const ring=w._el.querySelector(".ring"), b=ring.querySelector("b");
      if(val===undefined){ b.textContent="–"; ring.style.setProperty("--p",0); }
      else{ b.textContent=val; const p=Math.max(0,Math.min(100,(val-w.cfg.min)/(w.cfg.max-w.cfg.min)*100)); ring.style.setProperty("--p",p); }
    }else if(w.type==="led"){
      const lamp=w._el.querySelector(".lamp"); let on=false;
      if(val!==undefined){ const t=w.cfg.thr, cmp=w.cfg.cmp;
        on = cmp===">"?val>t : cmp===">="?val>=t : cmp==="<"?val<t : cmp==="<="?val<=t : val==t; }
      lamp.classList.toggle("on",on);
    }else if(w.type==="chart"){
      if(val!==undefined){ w._data.push(Number(val)); if(w._data.length>80) w._data.shift(); drawChart(w); }
    }
  });
}
function drawChart(w){
  const cv=w._el.querySelector("canvas"); if(!cv) return;
  const cssW=cv.clientWidth||280, cssH=cv.clientHeight||120;
  if(cv.width!==cssW){cv.width=cssW;} if(cv.height!==cssH){cv.height=cssH;}
  const ctx=cv.getContext("2d"), d=w._data, W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle="#eef2f7"; for(let g=0;g<=3;g++){const y=g*H/3;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  if(d.length<2) return;
  const mn=Math.min(...d), mx=Math.max(...d), rng=(mx-mn)||1;
  ctx.strokeStyle="#2b6cb0"; ctx.lineWidth=2; ctx.beginPath();
  d.forEach((v,i)=>{ const x=i*(W/(d.length-1)), y=H-8-((v-mn)/rng)*(H-16); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.stroke();
}

/* ===================== BLE 連線 ===================== */
$("conn").onclick=async()=>{
  if(!navigator.bluetooth){ alert("這個瀏覽器不支援藍牙。\n請用 App Store 的免費瀏覽器「Bluefy」開啟本頁。"); return; }
  if(connected){ try{device.gatt.disconnect();}catch(e){} return; }
  try{
    device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:"BBC micro:bit"}],optionalServices:[UART]});
    device.addEventListener("gattserverdisconnected",()=>setConn(false));
    const srv=await(await device.gatt.connect()).getPrimaryService(UART);
    for(const ch of await srv.getCharacteristics()){
      if(ch.properties.notify){ txChar=ch; await ch.startNotifications(); ch.addEventListener("characteristicvaluechanged",onData); }
      if(ch.properties.write||ch.properties.writeWithoutResponse) rxChar=ch;
    }
    setConn(true);
  }catch(e){ setConn(false); }
};
function setConn(v){ connected=v; $("dot").classList.toggle("on",v);
  $("stat").textContent=v?"已連線":"未連線"; $("conn").textContent=v?"斷線":"連線"; $("conn").classList.toggle("ghost",v);
  if(!v) $("rx").textContent=""; }

const dec=new TextDecoder();
function onData(e){
  rxBuf+=dec.decode(e.target.value); let i;
  while((i=rxBuf.indexOf("\n"))>=0){ const line=rxBuf.slice(0,i).trim(); rxBuf=rxBuf.slice(i+1); if(line){ $("rx").textContent="收 "+line; parse(line); } }
}
function parse(line){
  let got=false;
  line.split(",").forEach(tok=>{ const p=tok.indexOf(":"); if(p>0){
    const k=tok.slice(0,p).trim(), raw=tok.slice(p+1).trim();
    latest[k]=isNaN(Number(raw))?raw:Number(raw); seenKeys.add(k); got=true; }});
  if(got) updateDash();
}

const enc=new TextEncoder();
async function send(str){
  if(editMode||!connected||!rxChar||!str) return;
  try{ const d=enc.encode(str+"\n");
    for(let i=0;i<d.length;i+=20){ const c=d.slice(i,i+20);
      if(rxChar.properties.writeWithoutResponse) await rxChar.writeValueWithoutResponse(c); else await rxChar.writeValue(c); }
  }catch(e){}
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

/* ===================== 啟動 ===================== */
if(!navigator.bluetooth){ $("hint").innerHTML="⚠️ 這個瀏覽器不支援 Web Bluetooth。請用 App Store 免費的 <b>Bluefy</b> 瀏覽器開啟本頁，才能連線 micro:bit。"; }
loadCurrent(); render();
